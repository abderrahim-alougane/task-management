<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
      <link rel="icon" type="image/x-icon" href="https://icons.getbootstrap.com/assets/icons/list-task.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">📝 Task Manager</h1>

    <form name="data" action="/add" method="post" class="input-group mb-4">
        <input type="text" name="title" class="form-control" placeholder="Enter new task" required>
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

{% if tasks %}
    <ul class="list-group">
        {% for task in tasks %}
            <li  class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    {% if task.done %}
                        <s class="text-muted">{{ task.title }}</s>
                    {% else %}
                        {{ task.title }}
                    {% endif %}
                </div>
                <div>
                    {% if not task.done %}
                        <a href="/done/{{ loop.index0 }}" class="btn btn-sm btn-success me-2">Done</a>
                    {% endif %}
                    <a href="/delete/{{ loop.index0 }}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="alert alert-warning text-center" role="alert">
        No tasks yet! Add one above. 🚀
    </div>
{% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
